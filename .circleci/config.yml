version: 2.1

jobs:
  login-test:
    docker:
      - image: mcr.microsoft.com/playwright:v1.60.0-jammy

    environment:
      BASE_URL: http://127.0.0.1:3001
      LOGIN_USERNAME: testuser
      LOGIN_PASSWORD: "123456"

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Start local server
          command: npm run start
          background: true

      - run:
          name: Wait for server to be ready
          command: npx wait-on http://127.0.0.1:3001 --timeout 30000

      - run:
          name: Run Playwright tests
          command: npm run ci:test

      - run:
          name: Install GitHub CLI
          command: |
            set -e
            apt-get update
            apt-get install -y curl gpg

            mkdir -p -m 0755 /etc/apt/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg

            chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg

            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null

            apt-get update
            apt-get install -y gh

      - run:
          name: Check GH_TOKEN
          command: |
            set -e

            if [ -z "$GH_TOKEN" ]; then
              echo "GH_TOKEN is NOT available"
              exit 1
            fi

            echo "GH_TOKEN is available"
            gh auth status

      - run:
    name: Auto-create PR and merge if tests pass
    command: |
      set -e

      if [ "${CIRCLE_BRANCH}" = "main" ]; then
        echo "Currently on main branch. Skipping auto-merge."
        exit 0
      fi

      if [ -z "$GH_TOKEN" ]; then
        echo "GH_TOKEN is missing"
        exit 1
      fi

      echo "Creating or finding PR for ${CIRCLE_BRANCH}..."

      PR_URL=$(gh pr create \
        --base main \
        --head "${CIRCLE_BRANCH}" \
        --title "Auto-merge: ${CIRCLE_BRANCH}" \
        --body "This PR was automatically created by CircleCI after passing all automated tests." \
        2>/dev/null || gh pr view "${CIRCLE_BRANCH}" --json url -q .url)

      echo "PR URL: ${PR_URL}"

      echo "Merging PR..."
      gh pr merge "${PR_URL}" --merge --delete-branch

      echo "PR merged successfully."
    when: on_success

      - store_artifacts:
          path: playwright-report
          destination: playwright-report

      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  release-check:
    jobs:
      - login-test