<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Login Page</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="login-card">
        <h1>Welcome Koinan Back CircleCI</h1>
        <p class="subtitle">Login to continue to the demo dashboard.</p>

        <form id="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="input username" autocomplete="username" />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Input password" autocomplete="current-password" />

          <button id="login-button" type="submit">Login</button>
          <p id="error-message" class="error-message" role="alert"></p>
        </form>
      </section>
    </main>

    <script>
      const form = document.querySelector('#login-form');
      const errorMessage = document.querySelector('#error-message');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document.querySelector('#username').value.trim();
        const password = document.querySelector('#password').value.trim();

        if (username === 'testuser' && password === '123456') {
          sessionStorage.setItem('isLoggedIn', 'true');
          window.location.href = '/dashboard.html';
          return;
        }

        errorMessage.textContent = 'Invalid username or password.';
      });
    </script>
  </body>
</html>
